plugins {
    id 'org.springframework.boot' version '4.0.8' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'com.factoryflow'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    // 중간 디렉터리(common, services)는 모듈이 아님
    if (!project.buildFile.exists()) {
        return
    }

    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'

        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        // stop-check 훅은 -q 로 돌리므로, 실패한 테스트의 원인(ArchUnit 위반 내용 등)은 quiet 에서도 출력한다
        testLogging {
            quiet {
                events 'failed'
                exceptionFormat 'full'
                showStackTraces = false
            }
        }
    }

    if (project.path.startsWith(':services:')) {
        apply plugin: 'org.springframework.boot'
        // build/libs 에 bootJar 하나만 남긴다 (Dockerfile 이 build/libs/*.jar 를 복사)
        tasks.named('jar') { enabled = false }
    } else if (project.path.startsWith(':common:')) {
        apply plugin: 'java-library'
    }
}
