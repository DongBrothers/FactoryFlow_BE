name: incident
on:
  repository_dispatch:
    types: [cloudwatch-alarm]

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_READONLY_ROLE_ARN }}
          aws-region: ap-northeast-2
      # 로그와 ECS 상태는 워크플로가 먼저 파일로 받아 둔다 (Claude 는 aws 명령을 직접 실행하지 않는다)
      - name: collect logs and service state
        env:
          ALARM: ${{ github.event.client_payload.alarm }}
          CLUSTER: ${{ vars.ECS_CLUSTER }}
        run: |
          mkdir -p incident
          SVC=$(echo "$ALARM" | cut -d- -f2)
          case "$SVC" in
            gateway|order|inventory|purchase|production|auth|simulator) ;;
            *) SVC="" ;;
          esac
          echo "${SVC:-unknown}" > incident/service.txt
          if [ -z "$SVC" ]; then
            echo "알람 이름에서 서비스를 알 수 없어 로그를 조회하지 않음: $ALARM" > incident/logs.txt
            echo '{"note": "서비스를 알 수 없음"}' > incident/ecs.json
            exit 0
          fi
          aws logs tail "/ecs/ff-$SVC" --since 30m --format short > incident/logs-full.txt 2>&1 \
            || echo "로그 조회 실패 (위 메시지 참고)" >> incident/logs-full.txt
          tail -n 400 incident/logs-full.txt > incident/logs.txt
          aws ecs describe-services --cluster "${CLUSTER:-ff-cluster}" --services "ff-$SVC" \
            --query 'services[0].{status:status,desired:desiredCount,running:runningCount,pending:pendingCount,deployments:deployments[].{status:status,rollout:rolloutState,taskDefinition:taskDefinition,updatedAt:updatedAt},events:events[:10].[createdAt,message]}' \
            --output json > incident/ecs.json 2>&1 \
            || echo '{"error": "describe-services 실패 (파일 내용 참고)"}' >> incident/ecs.json
          wc -l incident/logs.txt
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            CloudWatch 알람: ${{ toJson(github.event.client_payload) }}
            아래 순서대로만 한다.
            1. incident/service.txt (대상 서비스), incident/logs.txt (최근 30분 로그 마지막 400줄),
               incident/ecs.json (ECS running/desired 수, 배포 상태, 최근 이벤트) 를 Read 로 읽는다
            2. 에러와 관련된 코드, docs/runbooks/ 를 확인한다
            3. .github/ISSUE_TEMPLATE/incident.md 의 섹션 구성대로 본문을 Write 도구로 issue-body.md 에 저장한다
               "조치 결과" 섹션은 비워둔다.
            4. gh issue create --title "[incident] <알람 이름>" --label incident --body-file issue-body.md 로 이슈를 만든다
            규칙
            - gh 명령은 파이프(|), 리다이렉션(>), $(...), 백틱 없이 단독으로 실행한다.
            - 이 저장소는 공개다. 로그 원문을 붙이지 말고 요약만 쓴다.
              개인정보, 토큰, 비밀번호, IP 주소, 계정 ID, 접속 주소(호스트명)는 이슈에 쓰지 않는다.
            - 파일에 오류만 있거나 비어 있으면 그 사실을 쓰고, 그래도 이슈는 반드시 만든다.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Write,Bash(gh issue create:*)"
            --max-turns 20
      - if: always()
        run: |
          curl -s -X POST -H 'Content-type: application/json' \
            -d "{\"text\":\"[FactoryFlow 장애] ${{ github.event.client_payload.alarm }} - GitHub incident 이슈 확인\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }}
