dependencies {
    implementation project(':common:common-web')
    implementation project(':common:common-event')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.1'
    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.1:jpa'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // 공정 센서값 (docs/specs/process-telemetry.md)
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation project(':common:common-test')
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testImplementation 'org.testcontainers:testcontainers-rabbitmq'
    testImplementation 'org.testcontainers:testcontainers-mongodb'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
}

// 테스트는 test 프로필로 돈다 (src/test/resources/application-test.yml: 배정 스케줄러 끔 등)
tasks.named('test') {
    systemProperty 'spring.profiles.active', 'test'
}
