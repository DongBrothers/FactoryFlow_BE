spring:
  application:
    name: purchase
  profiles:
    default: local
  rabbitmq:
    # common-event OutboxRelay 가 브로커 수신 확인(ack)을 받은 뒤에만 발행 완료로 기록한다
    publisher-confirm-type: correlated
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

# 로그 줄마다 traceId (TraceIdFilter·이벤트 수신이 MDC 에 넣는다, docs/specs/saga-order-fulfillment.md "추적")
logging:
  pattern:
    correlation: "[%X{traceId:-}] "
