spring:
  application:
    name: simulator
  profiles:
    default: local
  rabbitmq:
    # 보고는 Outbox 없이 바로 보낸다. 브로커 확인(ack)을 받을 때까지 메모리에 두고 다시 보낸다
    publisher-confirm-type: correlated
    listener:
      simple:
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
