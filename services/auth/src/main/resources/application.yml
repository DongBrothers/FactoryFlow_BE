spring:
  application:
    name: auth
  # 메일 서버. 기본값은 로컬 Mailpit(docker compose). 계정·비밀번호는 저장소에 두지 않고 환경별 설정(dev 는 APP_DEV_YML_AUTH)에서 덮어쓴다
  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8080

auth:
  allowed-email-domain: gmail.com   # 로컬·데모용 placeholder. 운영은 회사 도메인
  activation-token-ttl: 24h
  access-token-ttl: 15m
  refresh-token-ttl: 14d
  max-login-attempts: 5
  login-lock-window: 15m
  activation-mail:
    # 프론트의 활성화 페이지. 프론트가 아직 없어 로컬 자리표시자이고, 환경별 설정으로 바꾼다
    link-base-url: http://localhost:5173/activate
    from: ${spring.mail.username:noreply@factoryflow.local}
  cookie:
    secure: true       # 운영(HTTPS) 기본값. 로컬(http)은 application-local.yml 에서 false 로 덮어쓴다
    same-site: Lax

# Swagger: 공통 예외 핸들러의 응답을 모든 API 에 자동으로 붙이지 않는다 (API 마다 @ApiResponse 로 적는다)
springdoc:
  override-with-generic-response: false
  # 내부 API(/internal/**)는 서비스끼리만 부르고 프론트가 보지 않으므로 api-docs 에서 뺀다
  paths-to-exclude: /internal/**

management:
  endpoints:
    web:
      exposure:
        include: health
