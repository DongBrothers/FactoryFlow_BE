spring:
  application:
    name: auth
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8080

auth:
  allowed-email-domain: gmail.com   # 로컬·데모용 placeholder. 운영은 회사 도메인
  activation-token-ttl: 24h
  activation:
    expose-token-in-log: false      # 로컬에서 메일 서버 없이 토큰 확인 시 true (운영 금지)
  access-token-ttl: 15m
  refresh-token-ttl: 14d
  max-login-attempts: 5
  login-lock-window: 15m
  cookie:
    secure: true       # 운영(HTTPS) 기본값. 로컬(http)은 application-local.yml 에서 false 로 덮어쓴다
    same-site: Lax

management:
  endpoints:
    web:
      exposure:
        include: health
