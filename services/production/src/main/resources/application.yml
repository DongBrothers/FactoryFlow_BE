spring:
  application:
    name: production
  profiles:
    default: local
  rabbitmq:
    # common-event OutboxRelay 가 브로커 수신 확인(ack)을 받은 뒤에만 발행 완료로 기록한다
    publisher-confirm-type: correlated
    listener:
      simple:
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

# Swagger: 공통 예외 핸들러의 응답을 모든 API 에 자동으로 붙이지 않는다 (API 마다 @ApiResponse 로 적는다)
springdoc:
  override-with-generic-response: false

# 로그 줄마다 traceId (TraceIdFilter·이벤트 수신이 MDC 에 넣는다, docs/specs/saga-order-fulfillment.md "추적")
logging:
  pattern:
    correlation: "[%X{traceId:-}] "
