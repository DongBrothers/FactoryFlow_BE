spring:
  application:
    name: production
  profiles:
    default: local
  rabbitmq:
    # common-event OutboxRelay 가 브로커 수신 확인(ack)을 받은 뒤에만 발행 완료로 기록한다
    publisher-confirm-type: correlated
    listener:
      simple:
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

# Swagger: 공통 예외 핸들러의 응답을 모든 API 에 자동으로 붙이지 않는다 (API 마다 @ApiResponse 로 적는다)
springdoc:
  override-with-generic-response: false
  # 내부 API(/internal/**)는 서비스끼리만 부르고 프론트가 보지 않으므로 api-docs 에서 뺀다
  paths-to-exclude: /internal/**

# 로봇 공정 배정 (docs/specs/production-work-order.md "3. 로봇 공정 자동 진행")
# 배정을 받아 일할 가상 설비(simulator)가 생기기 전까지는 끈다. 켜 두면 배정된 공정을 받을 설비가 없어 차가 멈춘다.
# 그동안은 작업자 API 로 모든 공정을 진행한다
factoryflow:
  line:
    dispatch-enabled: false
    dispatch-interval: 5s
    press-hold: 1m
