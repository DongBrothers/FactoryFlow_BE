spring:
  application:
    name: production
  profiles:
    default: local
  rabbitmq:
    # common-event OutboxRelay 가 브로커 수신 확인(ack)을 받은 뒤에만 발행 완료로 기록한다
    publisher-confirm-type: correlated
    listener:
      simple:
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

# 서비스 간 호출 주소. 환경별 파일이나 환경 변수로 바꾼다. 기본값은 local 프로필의 inventory 포트(8082)
# 제품 등록·수정 때 BOM 부품이 있는지 확인한다 (docs/specs/master-data.md)
clients:
  inventory:
    url: ${INVENTORY_URL:http://localhost:8082}
    timeout: 3s

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

# Swagger: 공통 예외 핸들러의 응답을 모든 API 에 자동으로 붙이지 않는다 (API 마다 @ApiResponse 로 적는다)
springdoc:
  override-with-generic-response: false
  # 내부 API(/internal/**)는 서비스끼리만 부르고 프론트가 보지 않으므로 api-docs 에서 뺀다
  paths-to-exclude: /internal/**
