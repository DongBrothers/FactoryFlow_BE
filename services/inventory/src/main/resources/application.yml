spring:
  application:
    name: inventory
  profiles:
    default: local
  rabbitmq:
    # common-event OutboxRelay 가 브로커 수신 확인(ack)을 받은 뒤에만 발행 완료로 기록한다
    publisher-confirm-type: correlated
    listener:
      simple:
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

# 서비스 간 호출 주소. 환경별 파일이나 환경 변수로 바꾼다. 기본값은 local 프로필의 production 포트(8084)
# 재고 조정이 찜한 부품을 거둘 때 발행 전 차를 부품 대기로 되돌린다 (docs/specs/stock-adjustment.md)
clients:
  production:
    url: ${PRODUCTION_URL:http://localhost:8084}
    timeout: 3s

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  override-with-generic-response: false
  # 내부 API(/internal/**)는 서비스끼리만 부르고 프론트가 보지 않으므로 api-docs 에서 뺀다
  paths-to-exclude: /internal/**
