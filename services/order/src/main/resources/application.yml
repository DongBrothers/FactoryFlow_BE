spring:
  application:
    name: order
  profiles:
    default: local
  rabbitmq:
    # common-event OutboxRelay 가 브로커 수신 확인(ack)을 받은 뒤에만 발행 완료로 기록한다
    publisher-confirm-type: correlated
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8080

# 서비스 간 호출 주소. 환경별 파일이나 환경 변수로 바꾼다
clients:
  production:
    url: ${PRODUCTION_URL:http://localhost:8080}
    timeout: 3s

management:
  endpoints:
    web:
      exposure:
        include: health
